<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAIKU · Supabase</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #151515;
            color: #f2f2f2;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .haiku-loader {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        .haiku-loader strong {
            display: block;
            margin-bottom: 8px;
            font-size: 1.15rem;
        }

        .haiku-loader span {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="haiku-loader">
        <div>
            <strong>HAIKU</strong>
            <span>Preparando conexión segura…</span>
        </div>
    </div>

    <script>
        (async () => {
            "use strict";

            function cargarScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement("script");
                    script.src = src;
                    script.async = true;
                    script.onload = resolve;
                    script.onerror = () => reject(
                        new Error(`No fue posible cargar ${src}`)
                    );
                    document.head.appendChild(script);
                });
            }

            try {
                await cargarScript(
                    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
                );

                if (
                    !window.supabase ||
                    typeof window.supabase.createClient !== "function"
                ) {
                    throw new Error(
                        "supabase-js no quedó disponible en window.supabase"
                    );
                }

                const version = Date.now();

                const respuesta = await fetch(
                    `./index.html?v=${version}`,
                    { cache: "no-store" }
                );

                if (!respuesta.ok) {
                    throw new Error(
                        `No fue posible cargar index.html (${respuesta.status})`
                    );
                }

                let html = await respuesta.text();

                /* La tarjeta de Aseo se genera desde cabanas.js.
                   Versionarlo evita conservar su HTML anterior en caché. */
                html = html.replace(
                    'src="js/cabanas.js"',
                    `src="js/cabanas.js?v=${version}"`
                );

                html = html.replace(
                    "</head>",
                    `<link rel="stylesheet" href="css/supabase-pagos-v4-fix.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-webpay-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-cierre-final-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-cierre-modern-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-historial-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-revision-modern-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-cabanas-fotos-v2.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-aseo-modern-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-aseo-express-modern-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-aseo-express-actions-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-aseo-fotos-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-resumen-desktop-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-resumen-fondo-v3.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-reserva-multiple-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-reserva-grupo-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-pago-grupo-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-abonos-verificacion-v2.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-pagos-checkin-grupo-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-servicios-estados-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-pagos-desktop-grid-v1.css?v=${version}">\n<link rel="stylesheet" href="css/supabase-pagos-acciones-desktop-v1.css?v=${version}">\n</head>`
                );

                const marca = "<!-- JAVASCRIPT -->";

                if (!html.includes(marca)) {
                    throw new Error(
                        "No se encontró el punto de inserción JAVASCRIPT en index.html"
                    );
                }

                const scriptsSupabaseBase = [
                    `<script src="js/supabase-client.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-auth.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-edicion-pre.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-nueva-reserva-fullday-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-data.js?v=${version}"><` + '/script>'
                ].join("\n");

                html = html.replace(
                    marca,
                    `${marca}\n${scriptsSupabaseBase}`
                );

                const scriptsSupabaseV2 = [
                    `<script src="js/supabase-sync-v3.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-bloqueos-calendario-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-bloqueos-ui-fix-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-operacion-resumen-fix-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-resumen-rapido-touch-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-ficha-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-ficha-ocupacion-rapida-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-ficha-comentarios-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-reserva-estados-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-ficha-modal-guard-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-reactivar-canceladas-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-pagos-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-abonos-detalle-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-guard-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-pagos-guard-v3.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-pagos-checkin-v5.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-pagos-pendientes-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-ajustes-cargo-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-ajustes-cargo-manual-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-pagos-monto-formato.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-ficha-atajos.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-servicios-bridge-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-servicios-finanzas-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-servicios-hidratacion-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-servicios-estados-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-notificaciones-servicios-estados-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-servicios-tiempo-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-pagos-checkout-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-reserva-calendario-nav.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-webpay-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-cierre-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-cierre-evidencias-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-cierre-final-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-cierre-autorefresh-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-historial-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-notas-resumen-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-aseo-revision-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-revision-ui-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-cabanas-fotos-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-revision-resumen-sync-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-aseo-estado-sync-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-aseo-express-ui-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-aseo-operacion-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-aseo-realtime-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-auth-menu-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-reserva-multiple-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-reserva-grupo-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-pago-grupo-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-editar-abono-saldo-favor-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-editar-abonos-v1.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-abonos-verificacion-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-pagos-checkin-grupo-v2.js?v=${version}"><` + '/script>',
                    `<script src="js/supabase-saldo-favor-v2.js?v=${version}"><` + '/script>'
                ].join("\n");

                html = html.replace(
                    "</body>",
                    `${scriptsSupabaseV2}\n</body>`
                );

                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                console.error(
                    "HAIKU · No fue posible iniciar versión Supabase:",
                    error
                );

                document.body.innerHTML = `
                    <div class="haiku-loader">
                        <div>
                            <strong>No fue posible iniciar HAIKU</strong>
                            <span>
                                Recarga la página. Si continúa, revisa la consola.
                            </span>
                        </div>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
